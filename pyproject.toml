[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "hed-matlab"
version = "1.0.0"
description = "MATLAB tools for HED (Hierarchical Event Descriptors)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "HED Working Group", email = "hed.maintainers@gmail.com"}
]
keywords = ["HED", "hierarchical event descriptors", "MATLAB", "neuroscience"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: MATLAB",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/hed-standard/hed-matlab"
Documentation = "https://www.hedtags.org/hed-matlab"
Repository = "https://github.com/hed-standard/hed-matlab"
"Bug Tracker" = "https://github.com/hed-standard/hed-matlab/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "mdformat>=0.7.0",
    "mdformat-myst>=0.1.5",
    "typos",
]
docs = [
    "sphinx>=7.1.0,<10.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=3.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "sphinxcontrib-matlabdomain==0.22.1",
    "linkify-it-py>=2.0.3",
]

[tool.sphinx]
source-dir = "docs"
build-dir = "docs/_build"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

# __init__.py files: unused imports are re-exports, and their import order is
# often curated by hand to avoid circular imports - isort must not reorder them.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.typos.files]
extend-exclude = [
    "*.pdf", "*.svg", "*.xml", "*.mediawiki", "*.omn", "*.mat",
    "*.tsv", "*.json", "*.pyc", "*.po", "*.js.map", "*.css.map",
    "_build", "_static", "_templates",
    ".ruff_cache", ".pytest_cache", "*.egg-info",
    "data", "deprecated",
]

[tool.typos.default.extend-words]
hed = "hed"
covert = "covert"
